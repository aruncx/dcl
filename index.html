let index=0,score=0,answered={},soundOn=true,musicOn=false,audioCtx=null,musicTimer=null;
const $=id=>document.getElementById(id);$("total").textContent=QUESTIONS.length;
function cat(c){return c==="Mathematics"?["🔢","Mathematics"]:c==="EVS"?["🌿","EVS"]:["🌍","General Knowledge"];}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
 const q=QUESTIONS[index],x=cat(q.category);$("category").textContent=x[0]+" "+x[1];
 $("counter").textContent=`Question ${index+1} of ${QUESTIONS.length}`;$("score").textContent=score;
 $("earned").textContent=answered[index]?"+1 point earned":"Choose an answer";
 $("bar").style.width=((index+1)/QUESTIONS.length*100)+"%";$("question").textContent=q.q;
 const o=$("options");o.innerHTML="";
 q.opts.forEach((v,i)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span>${esc(v)}</span>`;b.onclick=()=>choose(i,b);o.appendChild(b)});
 $("prevBtn").disabled=index===0;$("nextBtn").textContent=index===QUESTIONS.length-1?"Finish 🎉":"Next →";
 $("feedback").className="feedback";$("feedback").textContent="";
}
function choose(i,b){
 if(answered[index])return;const q=QUESTIONS[index];
 if("ABCD"[i]===q.answer){
  answered[index]=true;score++;b.classList.add("correct");$("feedback").className="feedback good show";
  $("feedback").textContent="🎉 Excellent! You are correct! ⭐ +1 point";$("earned").textContent="+1 point earned";$("score").textContent=score;playTone("good");confetti();
  setTimeout(()=>{if(index<QUESTIONS.length-1){index++;render()}else finish()},850);
 }else{
  b.classList.add("wrong");$("feedback").className="feedback bad show";$("feedback").textContent="💪 Not quite! Try another answer. You can do it!";playTone("bad");setTimeout(()=>b.classList.remove("wrong"),450);
 }
}
function start(){index=0;score=0;answered={};$("home").style.display="none";$("result").style.display="none";$("quiz").style.display="block";render();if(musicOn)startMusic();scrollTo({top:0,behavior:"smooth"})}
function finish(){$("quiz").style.display="none";$("result").style.display="block";$("resultText").innerHTML=`You scored <b>${score}</b> out of <b>${QUESTIONS.length}</b> ⭐<br><small>Great job! Keep learning and keep smiling! 🌈</small>`;confetti(true)}
function playTone(type){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=type==="good"?660:190;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.22);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.24)}catch(e){}}
function startMusic(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(musicTimer)return;let notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23],n=0;musicTimer=setInterval(()=>{if(!musicOn)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.00001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.018,audioCtx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.00001,audioCtx.currentTime+.55);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.6)},650)}catch(e){}}
function confetti(big=false){let n=big?70:18;for(let i=0;i<n;i++){let s=document.createElement("span");s.className="confetti";s.style.left=Math.random()*100+"%";s.style.top=(-10-Math.random()*20)+"%";s.style.background=["#5b7cfa","#7bdcb5","#ffc857","#ff7f91","#9c7bff"][i%5];document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}
$("startBtn").onclick=start;$("againBtn").onclick=start;$("nextBtn").onclick=()=>{if(index<QUESTIONS.length-1){index++;render()}else finish()};$("prevBtn").onclick=()=>{if(index>0){index--;render()}};
$("musicBtn").onclick=()=>{musicOn=!musicOn;$("musicBtn").textContent=musicOn?"🎵 Music: On":"🎵 Music: Off";if(musicOn)startMusic()};
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 Sound: On":"🔇 Sound: Off"};
